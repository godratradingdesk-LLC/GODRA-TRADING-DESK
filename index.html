<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#161B23"/>
<!-- Security headers. base-uri/object-src/form-action work fine from a meta
     tag. frame-ancestors does NOT — browsers ignore it here by design and
     will warn in the console. Real clickjacking protection needs this same
     directive sent as an HTTP response header by whatever hosts the site
     (Vercel/Netlify/Cloudflare config, etc.), which a static build can't
     do on its own. Left in place since it's harmless and free to add once
     hosted properly. -->
<meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin"/>
<meta name="description" content="Godra Trading Desk — professional NinjaTrader 8 indicators, strategies and autotrading bots. Built by traders, for traders."/>
<link rel="icon" type="image/png" href="/favicon.png"/>
